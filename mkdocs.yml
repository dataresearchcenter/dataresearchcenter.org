site_name: Data and Research Center
site_url: https://darc.li
site_description: The Data and Research Center is an independent organization providing bespoke data and research services for investigative teams.

theme:
  name: material
  # Zensical: keep the Material for MkDocs look the CSS layers are built on.
  variant: classic
  custom_dir: docs/overrides
  logo: https://darcdn.et/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Subline-Neg.svg
  favicon: https://darcdn.et/style/logos/darc/favicon.ico
  # No Google Fonts; darc-zensical.css declares Inter and Sligoil Micro.
  font: false
  features:
    - header.autohide
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - toc.follow
    # - content.code.copy
  palette:
    scheme: slate
  icon:
    menu: material/menu

extra:
  # Category buttons on the blog listings (overrides/blog.html).
  blog_categories:
    - title: All posts
      url: blog/
    - title: DARC
      url: blog/category/darc/
    - title: OpenAleph
      url: blog/category/openaleph/
  # The header's logo on light sections
  logo_light: https://darcdn.et/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Subline-Pos.svg
  # Header buttons on `header: zone` pages. Site paths, not `#…`: instant
  # navigation keeps the header, links resolved on the page it was loaded on.
  signin:
    - label: Login
      url: https://darc.zone/notifications
    - label: Sign up
      url: zone/#signup
      primary: true
  # The drawer on every page: these landing page sections, then the pages
  drawer:
    - title: Updates
      url: ./#updates
    - title: What we do
      url: ./#what-we-do
    - title: Who we are
      url: ./#who-we-are
    - title: Contact
      url: ./#contact
  social:
    - icon: material/mail
      link: mailto:hi@dataresearchcenter.org
    - icon: material/linkedin
      link: https://www.linkedin.com/company/dataresearchcenter/
    - icon: material/github
      link: https://github.com/dataresearchcenter

extra_css:
  - https://darcdn.et/style/darc-zensical.css
  - stylesheets/tokens.css
  - stylesheets/components.css
  - stylesheets/site.css
  - stylesheets/landing.css

extra_javascript:
  - javascripts/scroll-color.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - meta
  - blog:
      post_url_date_format: yyyy
      blog_toc: false
      post_excerpt: required
  - search:
      enabled: false
  # A warm cache intermittently crashes the build ("... not in collection").
  - optimize:
      cache: false
      enabled: !ENV [CI, false]

# Included with --8<-- (make render)
exclude_docs: |
  /snippets/

not_in_nav: |
  index.md
  reference.md
  typography.md

nav:
  - Projects: projects.md
  - OpenAleph: openaleph.md
  - Blog: blog/index.md
