{#- Both logos: light surfaces show the dark one (site.css). -#}
<img class="md-logo__img md-logo__img--neg" src="{{ config.theme.logo | url }}" alt="{{ config.site_name }}">
{% if config.extra.logo_light %}
  <img class="md-logo__img md-logo__img--pos" src="{{ config.extra.logo_light | url }}" alt="{{ config.site_name }}">
{% endif %}
