site_name: Data and Research Center
site_url: https://dataresearchcenter.org
site_description: The Data and Research Center is an independent organization providing bespoke data and research services for investigative teams.

theme:
  name: material
  # Zensical: keep the Material for MkDocs look the CSS layers are built on.
  variant: classic
  custom_dir: docs/overrides
  logo: https://darcdn.et/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Subline-Neg.svg
  favicon: https://darcdn.et/style/logos/darc/favicon.ico
  # No Google Fonts; darc-zensical.css declares Inter and Sligoil Micro.
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - toc.follow
    # - content.code.copy
  palette:
    scheme: slate
  icon:
    menu: material/menu

extra:
  # Category buttons on the blog listings (overrides/blog.html).
  blog_categories:
    - title: All posts
      url: blog/
    - title: DARC
      url: blog/category/darc/
    - title: OpenAleph
      url: blog/category/openaleph/
  # The inverted header's logo (`header: inverted`)
  logo_light: https://darcdn.et/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Subline-Pos.svg
  # Header buttons on `header: zone` pages; Sign up goes to zone.md's guide.
  signin:
    - label: Login
      url: https://search.openaleph.org/api/2/sessions/oauth?next=%2Fnotifications
    - label: Sign up
      url: "#signup"
      primary: true
  social:
    - icon: material/mail
      link: mailto:hi@dataresearchcenter.org
    - icon: material/linkedin
      link: https://www.linkedin.com/company/dataresearchcenter/
    - icon: material/github
      link: https://github.com/dataresearchcenter

extra_css:
  - https://dataresearchcenter.github.io/zensical-theme-darc/stylesheets/darc-zensical.css
  - stylesheets/tokens.css
  - stylesheets/components.css
  - stylesheets/site.css
  - stylesheets/landing.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - meta
  - blog:
      post_url_date_format: yyyy
      blog_toc: false
      post_excerpt: required
  # Zensical enables search unless told not to.
  - search:
      enabled: false
  # A warm cache intermittently crashes the build ("... not in collection").
  - optimize:
      cache: false
      enabled: !ENV [CI, false]
  # Also in contrib/nginx.map
  - redirects:
      redirect_maps:
        "blog/2026/01/Our-Work-on-The-Damascus-Dossier/f891f334-c78a-46eb-8f1d-0909acbc92c4.md": "blog/posts/2026-01-15-our-work-on-the-damascus-dossier.md"
        "blog/2025/07/Why-We-Run-Our-Own-Servers-(And-Why-That-Matters-for-You)/02285437-436f-460c-921a-4b40342fb026.md": "blog/posts/2025-07-15-why-we-run-our-own-servers-and-why-that-matters-for-you.md"
        "blog/2025/04/Road-Trippin'-with-DARC/0504bd46-d8d7-4b98-b0b5-4ae4741dc841.md": "blog/posts/2025-04-18-road-trippin-with-darc.md"
        "blog/2025/03/Introducing-DARC:-The-Future-of-Investigative-Research-and-Data-Solutions/e862307a-e635-4101-9ad0-88b3fa51c0f9.md": "blog/posts/2025-03-31-introducing-darc-the-future-of-investigative-research-and-data-solutions.md"
        "who-we-are.md": "index.md#who-we-are"

# Included with --8<-- (make render)
exclude_docs: |
  /snippets/

not_in_nav: |
  index.md
  reference.md
  typography.md

nav:
  - Projects: projects.md
  - OpenAleph: openaleph.md
  - Blog: blog/index.md
